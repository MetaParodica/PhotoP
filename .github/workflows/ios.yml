name: iOS validation
on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Installed Xcode to validate (27 requires a runner image that contains Xcode 27)'
        type: choice
        options: ['26.3', '26.6', '27']
        default: '26.3'
      test_scope:
        description: 'Depth/UI isolate an iteration; all is the full regression gate'
        type: choice
        options: ['all', 'depth', 'ui']
        default: 'all'
      diagnostic_run:
        description: 'Existing run ID to inspect; leave empty for normal validation'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  inspect-ui-lock-log:
    if: github.ref == 'refs/heads/codex/ios18-bracket-scopes-20261118' && contains(github.event.head_commit.message, '[inspect-ui-lock]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read retained UI failure source locations
        run: |
          gh run download 44232594256 --repo "$GITHUB_REPOSITORY" --name photop-ui-log --dir retained-ui
          python3 - <<'PYLOCK'
          from pathlib import Path
          for path in Path('retained-ui').rglob('*.log'):
              for line in path.read_text(errors='replace').splitlines():
                  if ': error:' in line:
                      print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYLOCK
  diagnose:
    if: inputs.diagnostic_run != ''
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_TO_DIAGNOSE: ${{ inputs.diagnostic_run }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Download and inspect retained XCTest result
        shell: bash
        run: |
          [[ "$RUN_TO_DIAGNOSE" =~ ^[0-9]+$ ]]
          gh run download "$RUN_TO_DIAGNOSE" --repo "$GITHUB_REPOSITORY" --name photop-native-ui --dir retained
          mkdir -p diagnostics/exported
          found=0
          for bundle in UnitValidation LUTValidation UIValidation; do
            if [ ! -d "retained/$bundle.xcresult" ] && [ -f "retained/diagnostics/results/$bundle.xcresult.zip" ]; then
              ditto -x -k "retained/diagnostics/results/$bundle.xcresult.zip" retained
            fi
            if [ -d "retained/$bundle.xcresult" ]; then
              found=1
              xcrun xcresulttool get test-results summary --path "retained/$bundle.xcresult" > "diagnostics/$bundle-summary.json" 2> "diagnostics/$bundle-errors.log" || true
              cat "diagnostics/$bundle-summary.json"
              xcrun xcresulttool export diagnostics --path "retained/$bundle.xcresult" --output-path "diagnostics/exported/$bundle" 2>> "diagnostics/$bundle-errors.log" || true
            fi
          done
          [ "$found" = 1 ]
          python3 - <<'PYDIAG'
          import pathlib,tarfile
          needles=('Exception Type','Termination Reason','EXC_RESOURCE','EXC_BAD_ACCESS','SIGABRT','SIGKILL','Jetsam','testUniqueOriginalProfiles','memory limit','Test crashed')
          for path in pathlib.Path('diagnostics/exported').rglob('*'):
              if not path.is_file(): continue
              if tarfile.is_tarfile(path):
                  with tarfile.open(path) as archive:
                      for member in archive.getmembers():
                          if member.isfile() and member.size < 2000000 and member.name.endswith(('.ips','.crash','.log','.txt')):
                              source=archive.extractfile(member)
                              if source:
                                  rows=source.read().decode('utf-8','replace').splitlines()
                                  hits=[row for row in rows if any(n in row for n in needles)]
                                  if hits: print(member.name, '\n'.join(hits[:15]))
          PYDIAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photop-retained-diagnostics
          path: diagnostics/
  ios:
    if: inputs.diagnostic_run == ''
    runs-on: ${{ (inputs.xcode == '26.6' || inputs.xcode == '27') && 'macos-26' || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select and report SDK (never infer support from documentation alone)
        env:
          REQUESTED_XCODE: ${{ inputs.xcode || '26.3' }}
        run: |
          developer_dir="/Applications/Xcode_${REQUESTED_XCODE}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Requested Xcode is not installed on this runner. Choose a compatible runner; iOS27 validation has NOT passed."
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version
      - name: Verify pinned offline depth model
        run: |
          python3 scripts/check_depth_model.py
          python3 scripts/check_depth_acceptance.py docs/depth-acceptance/manifest.json --validate-only
      - name: Test portable composition and capture policies
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Verify Swift Debug and SDK conditions
        working-directory: ios
        run: |
          xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -configuration Debug -sdk iphonesimulator -showBuildSettings -json > /tmp/photop-build-settings.json
          python3 - <<'PYFLAGS'
          import json
          targets = json.load(open('/tmp/photop-build-settings.json'))
          settings = next(t['buildSettings'] for t in targets if t['target'] == 'PhotoP')
          assert settings['IPHONEOS_DEPLOYMENT_TARGET'] == '18.0', 'T00 requires iOS 18 deployment'
          flags = settings['SWIFT_ACTIVE_COMPILATION_CONDITIONS'].split()
          assert 'DEBUG' in flags, 'Swift DEBUG must enable Simulator review mode'
          sdk = settings['SDK_NAME']
          if '26.' in sdk or '27.' in sdk:
              assert 'PHOTOP_CAMERA_SDK26' in flags, 'SDK26 adapter must compile'
          if '27.' in sdk:
              assert 'PHOTOP_CAMERA_SDK27' in flags, 'SDK27 adapter must compile'
          print('Swift conditions:', flags, 'SDK:', sdk)
          PYFLAGS
      - name: Verify generated permission descriptions
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' PhotoP/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' PhotoP/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' PhotoP/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMotionUsageDescription' PhotoP/Info.plist
      - name: Build for iPhone without signing
        working-directory: ios
        run: |
          mkdir -p diagnostics
          set -o pipefail
          if ! xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -sdk iphoneos -configuration Debug -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee diagnostics/iphone-build.log; then
            python3 - <<'PYERRORS'
          from pathlib import Path
          errors = [line for line in Path('diagnostics/iphone-build.log').read_text(errors='replace').splitlines() if 'error:' in line]
          for line in errors[:15]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERRORS
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' .build/Build/Products/Debug-iphoneos/PhotoP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' .build/Build/Products/Debug-iphoneos/PhotoP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' .build/Build/Products/Debug-iphoneos/PhotoP.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSMotionUsageDescription' .build/Build/Products/Debug-iphoneos/PhotoP.app/Info.plist
      - name: Select available iOS Simulator
        working-directory: ios
        timeout-minutes: 5
        shell: bash
        run: |
          selection=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); choices=[(tuple(map(int,re.findall(r"\d+",k.split("iOS-")[-1]))),x["udid"]) for k,v in d["devices"].items() if "iOS-" in k for x in v if "iPhone" in x["name"]]; choices=[x for x in choices if x[0]>=(18,0)]; assert choices,"No available iPhone Simulator with iOS >=18.0"; version,udid=max(choices); print(".".join(map(str,version)),udid)')
          read -r runtime_version device_id <<< "$selection"
          echo "::notice::Selected iOS Simulator runtime: $runtime_version (minimum 18.0)"
          echo "PHOTOP_SIMULATOR=$device_id" >> "$GITHUB_ENV"
          xcrun simctl list devices available
          state=$(xcrun simctl list devices -j | python3 -c 'import json,sys; target=sys.argv[1]; print(next(d["state"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["udid"] == target))' "$device_id")
          if [ "$state" != Booted ]; then xcrun simctl boot "$device_id"; fi
          xcrun simctl bootstatus "$device_id" -b
      - name: Build application and tests for Simulator
        id: simulator_build
        working-directory: ios
        timeout-minutes: 10
        run: |
          mkdir -p diagnostics
          set -o pipefail
          if xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -destination "platform=iOS Simulator,id=$PHOTOP_SIMULATOR" -derivedDataPath .simulatorbuild -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee diagnostics/simulator-build.log; then
            exit 0
          fi
          python3 - <<'PYERRORS'
          from pathlib import Path
          errors = [line for line in Path('diagnostics/simulator-build.log').read_text(errors='replace').splitlines() if 'error:' in line]
          for line in errors[:15]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERRORS
          exit 1
      - name: Run application and depth XCTest on Simulator
        id: unit_tests
        if: inputs.test_scope != 'ui'
        working-directory: ios
        timeout-minutes: 12
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: |
          if [ "$TEST_SCOPE" = depth ]; then
            test_flags=(-only-testing:PhotoPTests/NaturalDepthTests -only-testing:PhotoPTests/DepthPhaseTests -only-testing:PhotoPTests/FocusDepthPolicyTests)
          else
            test_flags=(-only-testing:PhotoPTests -skip-testing:PhotoPTests/CompanyFilmLibraryTests -skip-testing:PhotoPTests/FilmStyleLibraryTests)
          fi
          python3 ../scripts/run_test_process.py --timeout 660 --log diagnostics/unit-tests.log -- xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -destination "platform=iOS Simulator,id=$PHOTOP_SIMULATOR" -derivedDataPath .simulatorbuild -resultBundlePath UnitValidation.xcresult "${test_flags[@]}" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve unit log before remaining suites
        if: always() && steps.simulator_build.outcome == 'success' && steps.unit_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: photop-unit-log
          path: ios/diagnostics/unit-tests.log
      - name: Reset selected Simulator after unit failure
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success' && steps.unit_tests.outcome == 'failure'
        timeout-minutes: 2
        run: |
          xcrun simctl shutdown "$PHOTOP_SIMULATOR" || true
          xcrun simctl boot "$PHOTOP_SIMULATOR"
          xcrun simctl bootstatus "$PHOTOP_SIMULATOR" -b
      - name: Run LUT generation and cache regression
        id: lut_tests
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success' && inputs.test_scope != 'depth' && inputs.test_scope != 'ui'
        working-directory: ios
        timeout-minutes: 8
        run: |
          python3 ../scripts/run_test_process.py --timeout 420 --log diagnostics/lut-tests.log -- xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -destination "platform=iOS Simulator,id=$PHOTOP_SIMULATOR" -derivedDataPath .simulatorbuild -resultBundlePath LUTValidation.xcresult -only-testing:PhotoPTests/CompanyFilmLibraryTests -only-testing:PhotoPTests/FilmStyleLibraryTests -testLanguage de -testRegion DE -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve LUT log before UI tests
        if: always() && steps.simulator_build.outcome == 'success' && inputs.test_scope != 'depth' && inputs.test_scope != 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: photop-lut-log
          path: ios/diagnostics/lut-tests.log
      - name: Reset selected Simulator after LUT failure
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success' && steps.lut_tests.outcome == 'failure'
        timeout-minutes: 2
        run: |
          xcrun simctl shutdown "$PHOTOP_SIMULATOR" || true
          xcrun simctl boot "$PHOTOP_SIMULATOR"
          xcrun simctl bootstatus "$PHOTOP_SIMULATOR" -b
      - name: Run camera UI interactions on Simulator
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success' && inputs.test_scope != 'depth'
        working-directory: ios
        timeout-minutes: 12
        run: |
          python3 ../scripts/run_test_process.py --timeout 660 --log diagnostics/ui-tests.log -- xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -destination "platform=iOS Simulator,id=$PHOTOP_SIMULATOR" -derivedDataPath .simulatorbuild -resultBundlePath UIValidation.xcresult -only-testing:PhotoPUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve UI log before result export
        if: always() && steps.simulator_build.outcome == 'success' && inputs.test_scope != 'depth'
        uses: actions/upload-artifact@v4
        with:
          name: photop-ui-log
          path: ios/diagnostics/ui-tests.log
      - name: Annotate native test failures with source locations
        if: always() && !cancelled() && steps.simulator_build.outcome == 'success'
        working-directory: ios
        run: |
          python3 - <<'PYFAILURES'
          from pathlib import Path
          for name in ('unit-tests','lut-tests','ui-tests'):
              path=Path('diagnostics')/(name+'.log')
              if not path.is_file(): continue
              lines=[line for line in path.read_text(errors='replace').splitlines() if ': error:' in line]
              for line in lines[:20]:
                  print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYFAILURES
      - name: Verify LUT resources and provenance
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check_lut_bundle.py
          python3 scripts/check_company_luts.py
          python3 scripts/check_depth_model.py
          test -d ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/DepthAnythingV2SmallF16.mlmodelc
          test -f ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/legal/NOTICE.txt
          cmp assets/luts/manifest.json ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/luts/manifest.json
          python3 scripts/check_lut_bundle.py --bundle ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/luts
          cmp assets/company-luts/manifest.json ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/company-luts/manifest.json
          python3 scripts/check_company_luts.py --bundle ios/.build/Build/Products/Debug-iphoneos/PhotoP.app/company-luts
      - name: Capture implemented camera UI on Simulator
        if: always() && !cancelled() && env.PHOTOP_SIMULATOR != '' && inputs.test_scope != 'depth'
        timeout-minutes: 3
        working-directory: ios
        run: |
          mkdir -p screenshots
          state=$(xcrun simctl list devices -j | python3 -c 'import json,os,sys; print(next(d["state"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["udid"] == os.environ["PHOTOP_SIMULATOR"]))')
          if [ "$state" != Booted ]; then xcrun simctl boot "$PHOTOP_SIMULATOR"; fi
          xcrun simctl bootstatus "$PHOTOP_SIMULATOR" -b
          xcrun simctl status_bar "$PHOTOP_SIMULATOR" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$PHOTOP_SIMULATOR" .simulatorbuild/Build/Products/Debug-iphonesimulator/PhotoP.app
          for view in camera guide video person looks depth; do
            args="--ui-review"
            if [ "$view" = guide ]; then args="$args --review-guide"; fi
            if [ "$view" = person ]; then args="$args --review-person"; fi
            if [ "$view" = looks ]; then args="$args --review-looks"; fi
            if [ "$view" = video ]; then args="$args --review-video"; fi
            if [ "$view" = depth ]; then args="$args --review-depth"; fi
            xcrun simctl launch --terminate-running-process "$PHOTOP_SIMULATOR" com.photop.camera $args
            sleep 3
            xcrun simctl io "$PHOTOP_SIMULATOR" screenshot "screenshots/$view.png"
            sips -Z 1280 -s format jpeg -s formatOptions 72 "screenshots/$view.png" --out "screenshots/$view.jpg"
          done
      - name: Preserve test summaries and closed result archives
        if: always()
        working-directory: ios
        timeout-minutes: 4
        shell: bash
        run: |
          mkdir -p diagnostics/results
          if [ -n "$PHOTOP_SIMULATOR" ]; then xcrun simctl shutdown "$PHOTOP_SIMULATOR" || true; fi
          for bundle in UnitValidation LUTValidation UIValidation; do
            if [ -d "$bundle.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$bundle.xcresult" > "diagnostics/$bundle-summary.json" 2> "diagnostics/$bundle-errors.log" || true
              python3 - "$bundle" "diagnostics/$bundle-summary.json" <<'PYSUMMARY'
          import json,sys
          try:
              data=json.load(open(sys.argv[2]))
              keys=('result','totalTestCount','passedTests','failedTests','skippedTests','expectedFailures')
              summary={key:data[key] for key in keys if key in data}
              text=json.dumps(summary,ensure_ascii=False)
              print('::notice::'+sys.argv[1]+' XCTest summary: '+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              if data.get('testFailures'):
                  failures=json.dumps(data['testFailures'],ensure_ascii=False)[:6000]
                  print('::error::'+sys.argv[1]+' XCTest failures: '+failures.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          except (OSError,ValueError):
              print('::notice::'+sys.argv[1]+' XCTest summary unavailable; inspect retained result')
          PYSUMMARY
              ditto -c -k --keepParent "$bundle.xcresult" "diagnostics/results/$bundle.xcresult.zip" || true
            fi
          done
      - name: Upload native UI screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photop-native-ui
          compression-level: 0
          path: |
            ios/screenshots/
            ios/diagnostics/
