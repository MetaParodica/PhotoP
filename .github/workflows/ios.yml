name: iOS validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPhone without signing
        working-directory: ios
        run: xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Test model validation on Simulator
        working-directory: ios
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project PhotoP.xcodeproj -scheme PhotoP -destination "platform=iOS Simulator,id=$device_id" CODE_SIGNING_ALLOWED=NO test
      - name: Verify LUT bundle policy
        run: python3 scripts/check_lut_bundle.py
