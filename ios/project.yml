name: PhotoP
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(PHOTOP_CAMERA_SDK_FLAGS)"
    PHOTOP_CAMERA_SDK_FLAGS: ""
    "PHOTOP_CAMERA_SDK_FLAGS[sdk=iphoneos26*]": PHOTOP_CAMERA_SDK26
    "PHOTOP_CAMERA_SDK_FLAGS[sdk=iphonesimulator26*]": PHOTOP_CAMERA_SDK26
    "PHOTOP_CAMERA_SDK_FLAGS[sdk=iphoneos27*]": PHOTOP_CAMERA_SDK26 PHOTOP_CAMERA_SDK27
    "PHOTOP_CAMERA_SDK_FLAGS[sdk=iphonesimulator27*]": PHOTOP_CAMERA_SDK26 PHOTOP_CAMERA_SDK27
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.photop.camera
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(PHOTOP_CAMERA_SDK_FLAGS)"
targets:
  PhotoP:
    type: application
    platform: iOS
    sources:
      - path: PhotoP
      - path: ../assets/luts
        type: folder
        buildPhase: resources
      - path: ../assets/company-luts
        type: folder
        buildPhase: resources
      - path: ../assets/depth-model/DepthAnythingV2SmallF16.mlpackage
        type: file
        buildPhase: sources
      - path: ../assets/depth-model/legal
        type: folder
        buildPhase: resources
      - path: ../assets/experimental-depth/ExperimentalPhotoEncoder.mlpackage
        type: file
        buildPhase: sources
      - path: ../assets/experimental-depth/ExperimentalPhotoInitializer.mlpackage
        type: file
        buildPhase: sources
      - path: ../assets/experimental-depth/ExperimentalDepthLegal
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: PhotoP/Info.plist
  PhotoPTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhotoPTests]
    dependencies:
      - target: PhotoP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.photop.camera.tests
  PhotoPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhotoPUITests]
    dependencies:
      - target: PhotoP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.photop.camera.uitests
schemes:
  PhotoP:
    build:
      targets:
        PhotoP: all
        PhotoPTests: [test]
    test:
      targets: [PhotoPTests, PhotoPUITests]
